name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: graphatlas
          POSTGRES_PASSWORD: graphatlas
          POSTGRES_DB: graphatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphatlas -d graphatlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://graphatlas:graphatlas@localhost:5432/graphatlas
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & typecheck (strict TypeScript)
        run: bun run lint

      - name: Run tests (unit + integration against PostgreSQL 17 + pgvector)
        run: bun run test

      - name: Build web
        run: bun run build:web

      - name: Web unit/component tests (vitest)
        run: bun run test:web
